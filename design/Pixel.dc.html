  <style>

    a { color: #ffd400; } a:hover { color: #fff07a; }
    /* 네 귀가 깎인 픽셀 테두리 — 둥근 모서리 대신 계단으로 */
    .px {
      box-shadow:

        0 -8px 0 0 var(--e2, transparent);

<div style="width: 390px; height: 844px; overflow: hidden; background: #14182b; font-family: 'Do Hyeon', sans-serif; color: #e8ecf5; box-sizing: border-box; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; image-rendering: pixelated;">

    <div style="background: #232a49; padding: 7px 12px; --e: #4a5788;" class="px">전부 지우기</div>
    <div style="margin-left: auto; background: #232a49; padding: 7px 12px; --e: #4a5788;" class="px">굵기 2</div>
